name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: Release
        type: boolean
        required: true
        default: false

defaults:
  run:
    # NOTE: Default option does not include `-o pipefail` as documented
    # unless explicitly specifying the `bash` shell.
    # https://github.com/actions/runner/issues/353
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: |
          sudo apt-get install -y clang-format
          clang-format --version

      - name: Run formatting checks
        run: |
          find ./main/ -iregex '.*\.\(c\|h\|cpp\|hpp\)$' -type f -print0 | xargs -0 -L1 clang-format -style=file --dry-run --Werror

  test-erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    container:
      image: kicad/kicad:10.0.7
      options: --user=root

    steps:
      # NOTE: Requires running KiCad container image as root
      # https://github.com/actions/checkout/issues/956
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      # NOTE: KiCad CLI expects the global tables to be in `~/.config/kicad/X.Y`
      # and this is already correctly set up in the KiCad Docker image but GitHub
      # Actions runs the container with a different `HOME` directory so we need
      # to copy these files over.
      - name: Set up global symbol/footprint tables
        run: |
          mkdir -p "${HOME}/.config"
          cp -Rv '/home/kicad/.config/kicad' "${HOME}/.config"

      - name: Ensure build directories exists
        run: |
          mkdir -p ./build/

      - name: Show KiCad version
        run: |
          kicad-cli version

      - name: Run tests
        run: |
          kicad-cli sch erc \
            --exit-code-violations \
            --output ./build/MitsubishiSC.rpt \
            ./hardware/MitsubishiSC.kicad_sch

      - name: Display report
        if: success() || failure()
        run: |
          cat ./build/MitsubishiSC.rpt

      - name: Upload report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MitsubishiSC-hw-rpt-erc
          path: ./build/

  test-drc:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    container:
      image: kicad/kicad:10.0.7
      options: --user=root

    steps:
      # NOTE: Requires running KiCad container image as root
      # https://github.com/actions/checkout/issues/956
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      # NOTE: KiCad CLI expects the global tables to be in `~/.config/kicad/X.Y`
      # and this is already correctly set up in the KiCad Docker image but GitHub
      # Actions runs the container with a different `HOME` directory so we need
      # to copy these files over.
      - name: Set up global symbol/footprint tables
        run: |
          mkdir -p "${HOME}/.config"
          cp -Rv '/home/kicad/.config/kicad' "${HOME}/.config"

      - name: Ensure build directories exists
        run: |
          mkdir -p ./build/

      - name: Show KiCad version
        run: |
          kicad-cli version

      - name: Run tests
        run: |
          kicad-cli pcb drc \
            --exit-code-violations \
            --schematic-parity \
            --output ./build/MitsubishiSC.rpt \
            ./hardware/MitsubishiSC.kicad_pcb

      - name: Display report
        if: success() || failure()
        run: |
          cat ./build/MitsubishiSC.rpt

      - name: Upload report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MitsubishiSC-hw-rpt-drc
          path: ./build/MitsubishiSC.rpt

  build-fw:
    needs:
      - fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IDF_CCACHE_ENABLE: 1

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up ESP-IDF
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1
        with:
          version: v5.5.5

      - name: Show ESP-IDF version
        run: |
          idf.py --version

      # NOTE: This step needs to run first so that sdkconfig is generated to derive cache key
      - name: Set compile target
        run: |
          idf.py -D SDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.mfgpart;sdkconfig.thread' set-target esp32c6

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache-${{ runner.os }}-${{ hashFiles('sdkconfig') }}-${{ hashFiles('**/CMakeLists.txt') }}
          path: |
            ~/.cache/ccache

      - name: Compile firmware
        run: |
          idf.py build

      - name: Display firmware size
        run: |
          idf.py size
          idf.py size-components
          idf.py size-files

      - name: Display cache statistics
        run: |
          ccache --show-stats

      # NOTE: Combines the bootloader, partition table, OTA data and app into
      # a single image written at 0x0. The `--fill-flash-size` option must NOT
      # be used as it pads the image to the end of flash, which erases the
      # per-device `fctry` partition.
      - name: Create full flash image
        run: |
          idf.py merge-bin

      # NOTE: Release asset naming convention is
      # `<project>-v<version>-fw-<target>-<variant>-<content>.<ext>`
      - name: Prepare firmware artifacts
        run: |
          build_version="$(< ./VERSION)"
          asset_prefix="MitsubishiSC-v${build_version}-fw-esp32c6-thread"

          mkdir -p ./build/dist/
          cp ./build/merged-binary.bin "./build/dist/${asset_prefix}-full.bin"
          cp ./build/MitsubishiSC.bin "./build/dist/${asset_prefix}-app.bin"
          cp ./build/MitsubishiSC.elf "./build/dist/${asset_prefix}-app.elf"
          ls -lah ./build/dist/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MitsubishiSC-build-fw
          path: ./build/dist/
          if-no-files-found: error

  build-hw:
    needs:
      - test-erc
      - test-drc
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    container:
      image: kicad/kicad:10.0.7
      options: --user=root

    steps:
      # NOTE: Requires running KiCad container image as root
      # https://github.com/actions/checkout/issues/956
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      # NOTE: KiCad CLI expects the global tables to be in `~/.config/kicad/X.Y`
      # and this is already correctly set up in the KiCad Docker image but GitHub
      # Actions runs the container with a different `HOME` directory so we need
      # to copy these files over.
      - name: Set up global symbol/footprint tables
        run: |
          mkdir -p "${HOME}/.config"
          cp -Rv '/home/kicad/.config/kicad' "${HOME}/.config"

      # NOTE: The workspace directory is not marked as safe directory
      # when running in container due to Git config issues, so this
      # needs to be done explicitly.
      # https://github.com/actions/checkout/issues/1169
      # NOTE: The `GITHUB_WORKSPACE` variable must be used when running
      # in container because `github.workspace` refers to a different path.
      # https://github.com/actions/runner/issues/2058
      - name: Mark Git workspace as safe directory
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # NOTE: The official KiCad Docker image does not include 3D models
      # in the image so this needs to be injected in runtime.
      # https://gitlab.com/kicad/packaging/kicad-cli-docker/-/issues/6
      - name: Fetch 3D models
        run: |
          git clone \
            --branch 10.0.7 \
            --depth 1 \
            https://gitlab.com/kicad/libraries/kicad-packages3D.git \
            /usr/share/kicad/3dmodels

      # NOTE: Requires running KiCad container image as `runner` user
      # https://github.com/actions/runner/issues/2033
      - name: Generate export files
        env:
          # NOTE: Required for custom 3D libraries to be rendered
          CUSTOM_LIBRARY_DIR: ./hardware/lib/lib
        run: |
          ./scripts/export.sh

      - name: Upload hardware artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MitsubishiSC-build-hw
          path: ./build/hardware/
          if-no-files-found: error

  release:
    needs:
      - build-fw
      - build-hw
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write # NOTE: Required to create GitHub releases

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # NOTE: Required to fetch ALL tags

      # NOTE: The pattern excludes the ERC/DRC report artifacts, and the build
      # artifacts are merged as the release assets are already uniquely named.
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: MitsubishiSC-build-*
          path: ./dist/
          merge-multiple: true

      # NOTE: The build version (i.e. `VERSION`) must either be the released
      # version (i.e. latest `vX.Y.Z` tag) or exactly a single major, minor or
      # patch increment from it.
      - name: Determine build and released versions
        id: version
        run: |
          build_version="$(< ./VERSION)"
          if [[ ! "${build_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf "error: VERSION is not a valid X.Y.Z version: got %s\n" "${build_version}" >&2
            exit 1
          fi

          released_version="$(git tag --list | sed 's/^v//' | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/' | sort --version-sort | tail -n 1)"
          released_version="${released_version:-0.0.0}"
          IFS='.' read -r major minor patch <<< "${released_version}"
          allowed_versions=(
            "${released_version}"
            "$((major + 1)).0.0"
            "${major}.$((minor + 1)).0"
            "${major}.${minor}.$((patch + 1))"
          )

          printf "RELEASED:\t%s\n" "${released_version}"
          printf "BUILD:\t%s\n" "${build_version}"
          printf "ALLOWED:\t%s\n" "${allowed_versions[*]}"

          if [[ " ${allowed_versions[*]} " != *" ${build_version} "* ]]; then
            printf "error: VERSION is not the released version or a single increment from it: got %s\n" "${build_version}" >&2
            exit 1
          fi

          echo "build=${build_version}" >> "${GITHUB_OUTPUT}"
          echo "released=${released_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify build version is unreleased
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release
        env:
          BUILD_VERSION: ${{ steps.version.outputs.build }}
          RELEASED_VERSION: ${{ steps.version.outputs.released }}
        run: |
          if [[ "${BUILD_VERSION}" == "${RELEASED_VERSION}" ]]; then
            printf "error: VERSION is already released: got %s\n" "${BUILD_VERSION}" >&2
            exit 1
          fi

      - name: Generate checksums
        working-directory: ./dist
        run: |
          sha256sum -- * > SHA256SUMS

      - name: Display release assets
        run: |
          ls -lah ./dist/
          cat ./dist/SHA256SUMS

      # NOTE: The `--target` flag ensures that the tag is created on the commit
      # that was built, instead of the branch HEAD which may have moved on.
      - name: Create release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ steps.version.outputs.build }}
        run: |
          gh release create "v${BUILD_VERSION}" --target "${GITHUB_SHA}" --generate-notes --fail-on-no-commits ./dist/*
